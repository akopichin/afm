# yaml-language-server: $schema=https://raw.githubusercontent.com/akopichin/afm/main/schema/config.schema.json
# Project .afm/config.yaml overrides global ~/.afm/config.yaml; omitted fields keep defaults.

# Web dashboard theme. "graphite" — default product skin: material hierarchy on a cool graphite canvas,
# indigo interaction accent, mint success and amber attention (dark & light).

# Fully custom dashboard skin: a directory containing index.css. Overrides `theme`. Default: "" (use the
# built-in theme) skin_dir: .afm/skin/

# Automatically reset failed stages back to pending on run start/resume — no manual `afm retry <id>` per
# failed stage. Default: true auto_recover: true

# server: # Open the dashboard in a browser automatically on startup. # Default: false — the URL is
# printed to the log, open it manually. # open_browser: true # port: 9876

# AI client settings
client:
  # Command to run as the AI agent.
  # Default: "claude"
  command: claude

  # Extra arguments appended to the command.

  # claude_bare: whether to add --bare to generated claude wrappers. Enable claude_bare: true only for
  # flows WITHOUT skills.

  # reasoning: reasoning (thinking) effort for the default claude client, mapped to claude's --effort for
  # the author stages, side agent, JSON-repair helper and memory rebuild (the AI verify reviewer does not
  # get it). Levels: minimal, low, medium, high, xhigh, max (minimal is clamped to low — claude has no
  # minimal). Empty → not passed. An unrecognized value is forwarded as-is; `afm run` warns but does not
  # fail on it — the claude backend may still reject it and fail that invocation.
  # reasoning: medium

# Execution parameters executor: Maximum idle time with no output from the agent before killing the
# process. Default: 30m idle_timeout: 30m

  # Maximum number of stages running in parallel (0 = unlimited). Default: 0 max_parallel: 4

  # Max chars for agent text/Bash-command detail logged to <phase>.log and the agent_action event feed (0
  # = no limit — the full text/command is kept). Default: 0 truncate_output: 100

# Cost accounting: overrides/extends the built-in list-price rate table used to estimate stage/run token
# cost in the dashboard. All rates are decimal USD PER 1,000,000 TOKENS.

# Directory with custom prompt templates. Recognized files: planning.md, implementation.md, review.md,
# summary.md, autonomous.md, reflect.md, aggregate.md, prioritize.md, update.md.

# Docker mode — run afm and the agents inside a Docker container. Enabled via this config or the
# AFM_USE_DOCKER=1 environment variable.

# Dashboard side agent — the free-form chat alongside the run. ON by default.

# Collaboration dashboard mode: "team" (default) shows Team, Board and People;
# "assistants" hides those views and shows run-wide conversations in a right panel.
# Set collaboration.mode in this file or flow.yaml (flow overrides project, then global config).
# collaboration:
#   mode: assistants

# Per-flow git worktrees — run each flow on its own branch/worktree under .worktrees/<flow>. OFF by
# default; opt in here with worktrees.enabled: true, or set AFM_WORKTREES=1.
# worktrees:
#   enabled: true

# Accounting DISPLAY switch. Controls only whether cost is SHOWN: the dashboard cost tile/tab/rail, the
# TOKENS/CACHE/EST.

# Verify gate — how many verify rejections are tolerated before a stage fails. Only an AI step with no
# shell step after it can be accepted this way (a red test is never accepted).

# Managed Chrome DevTools browser capability. afm drives a real Chrome on the host so a stage agent can
# run the app for real ("живой прогон"), both in Docker and when afm runs natively.
