# afm Configuration
# Place in: .afm/config.yaml (project-level) or ~/.afm/config.yaml (global)
# Project-level config overrides global. Missing fields keep defaults.

# AI client settings
client:
  # Command to run as the AI agent.
  # Default: "claude"
  command: claude

  # Extra arguments appended to the command.
  # Default: ["--print", "--output-format", "stream-json", "--verbose", "--dangerously-skip-permissions"]
  # (auto-added for "claude", override here for custom commands)
  # extra_args:
  #   - --my-custom-flag

# Execution parameters
executor:
  # Maximum idle time with no output from the agent before killing the process.
  # Default: 30m
  # idle_timeout: 30m

  # Maximum number of stages running in parallel (0 = unlimited).
  # Default: 0
  # max_parallel: 4

# Directory with custom prompt templates (overrides embedded defaults).
# Files needed: planning.md, implementation.md, review.md, summary.md
# Default: "" (use embedded prompts)
# prompts_dir: .afm/prompts/

# Built-in reverse proxy settings.
# The proxy intercepts agent HTTP traffic and applies transforms.
# Default: enabled when ANTHROPIC_BASE_URL is set or proxy.upstream is configured.
# proxy:
#   # Set to false to disable the proxy entirely.
#   # Default: true
#   # enabled: true
#
#   # Upstream Anthropic-compatible API base URL.
#   # Default: "" (reads from ANTHROPIC_BASE_URL environment variable)
#   # upstream: https://api.z.ai/api/anthropic
#
#   # Proxy listen port (0 = random free port).
#   # Default: 0
#   # port: 0
#
#   # Transform overrides. null/absent = auto-detect by upstream host.
#   # transforms:
#   #   zai: true   # force-enable ZAI fix (non-streaming→streaming for api.z.ai)
#   #   zai: false  # force-disable even when upstream is api.z.ai

# Docker mode — запускать afm и агентов внутри Docker-контейнера.
# Включается через конфиг или переменную окружения AFM_USE_DOCKER=1.
# docker:
#   # Включить Docker mode. nil/absent → смотрим $AFM_USE_DOCKER.
#   # Default: false
#   # enabled: true
#
#   # Docker-образ для запуска.
#   # Default: "akopichin/afm:latest" (или $AFM_DOCKER_IMAGE)
#   # image: akopichin/afm:latest
#
#   # Доп. хост-директории для кастомных агентов (токены/конфиги вне ~/.claude,
#   # напр. ~/.ai-free для GLM-обёрток glm51/glm52). Пути с ~ → /root/…, абсолютные —
#   # тот же путь; монтируются только для чтения.
#   # extra_mounts:
#   #   - ~/.ai-free
