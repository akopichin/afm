# afm Configuration
# Place in: .afm/config.yaml (project-level) or ~/.afm/config.yaml (global)
# Project-level config overrides global. Missing fields keep defaults.

# Тема веб-дашборда.
# "coffee"      — дефолтная кофейно-ламповая тема: тёплый тёмный фон и янтарное
#                 «свечение радиолампы» (dark) / кремовое латте (light), матча-акцент.
# "goga"        — тёмная tech-тема по мотивам qarium.ru/goga (teal-акцент #20D4BF,
#                 sans-serif шрифт, скруглённые углы, лого Goga, английский UI).
# "novacorps"   — прежняя hi-tech тема (мятный акцент, моноширинный шрифт,
#                 scanline/неон-декор).
# Светлый/тёмный режим внутри темы переключается тумблером в самом дашборде.
# Любое иное или пустое значение → дефолтная "coffee" (неизвестное — warning в stderr).
# Default: "coffee"
# theme: coffee

# Автоматически возвращать failed-стейджи в pending при старте/резюме рана
# (напр. если процесс/контейнер afm был прибит во время выполнения) — без
# ручного `afm retry <id>` на каждый упавший стейдж. Ретраятся все failed-
# стейджи без разбора причины падения; порядок соблюдается штатным
# depends_on-планировщиком (зависимый стейдж не стартует, пока его depends_on
# не в done).
# Default: true
# auto_recover: true

# server:
#   # Открывать браузер с дашбордом автоматически при запуске.
#   # Default: false — URL печатается в лог, откройте вручную.
#   # open_browser: true
#   # port: 9876

# AI client settings
client:
  # Command to run as the AI agent.
  # Default: "claude"
  command: claude

  # Extra arguments appended to the command.
  # Default: ["--print", "--output-format", "stream-json", "--verbose", "--dangerously-skip-permissions"]
  # (auto-added for "claude", override here for custom commands)
  # extra_args:
  #   - --my-custom-flag

  # claude_bare: добавлять ли --bare в генерируемые claude-обёртки (autoShim).
  # --bare = minimal mode claude Code: пропускает CLAUDE.md auto-discovery,
  # SessionStart-хуки, skills-listing, auto-memory (~120 KB автоконтекста) — body
  # запроса ~4 KB вместо ~127 KB (меньше токенов и нагрузки на шлюз/z.ai, ниже шанс
  # 529). НО --bare ломает Skill-tool: goga-* skills перестают резолвиться (агент
  # имитирует их сам). Default: false (skills важнее). Включайте claude_bare: true
  # только для flows БЕЗ skills.
  # claude_bare: false

# Execution parameters
executor:
  # Maximum idle time with no output from the agent before killing the process.
  # Default: 30m
  # idle_timeout: 30m

  # Maximum number of stages running in parallel (0 = unlimited).
  # Default: 0
  # max_parallel: 4

  # Max chars for agent text/Bash-command detail logged to <phase>.log and the
  # agent_action event feed (0 = no limit — the full text/command is kept).
  # Default: 0
  # truncate_output: 100

# Directory with custom prompt templates (overrides embedded defaults).
# Files needed: planning.md, implementation.md, review.md, summary.md
# Default: "" (use embedded prompts)
# prompts_dir: .afm/prompts/

# Docker mode — запускать afm и агентов внутри Docker-контейнера.
# Включается через конфиг или переменную окружения AFM_USE_DOCKER=1.
# docker:
#   # Включить Docker mode. nil/absent → смотрим $AFM_USE_DOCKER.
#   # Default: false
#   # enabled: true
#
#   # Docker-образ для запуска.
#   # Default: "akopichin/afm:latest" (или $AFM_DOCKER_IMAGE)
#   # image: akopichin/afm:latest
#
#   # autoShim: по флагу afm генерирует claude-врапперы для agents.<cmd> прямо в
#   # контейнере — без монтирования бинарника и без extra_mounts для токенов.
#   # Нужен образ, собранный из кода с autoShim. recipe = model + url +
#   # system_prompt(file:) + auth{from,to}. auth.from — путь к файлу или env:VAR,
#   # где afm читает секрет НА ХОСТЕ (само значение токена в конфиге НЕ хранится —
#   # попадает в контейнер как transient env). auth.to ∈ {env:CLAUDE_CODE_OAUTH_TOKEN,
#   # env:ANTHROPIC_API_KEY, env:ANTHROPIC_AUTH_TOKEN}. model ставится во все 3 тира.
#   # url bake'ится в враппер как ANTHROPIC_BASE_URL (z.ai, deepseek — напрямую).
#   # autoShim: true
#   # agents:
#   #   glm52:                                  # пример (пути реальные, токенов в конфиге нет)
#   #     model: glm-5.2
#   #     url: https://api.z.ai/api/anthropic
#   #     system_prompt: "file:~/.ai-free/claude-glm/system-prompt.md"
#   #     auth:
#   #       from: "file:~/.ai-free/claude-glm/token"
#   #       to: "env:ANTHROPIC_AUTH_TOKEN"
#   #   deepseek-v4:                            # docker-only (бинарника на хосте нет) + cross-gateway
#   #     model: deepseek-v4-pro
#   #     url: https://api.deepseek.com/anthropic
#   #     auth:
#   #       from: "file:~/.ai-free/claude-glm/token-deepseek"
#   #       to: "env:ANTHROPIC_AUTH_TOKEN"
#   #   cursor:                                # type:cursor → Cursor Cloud Agents API (НЕ openai chat!)
#   #     type: cursor                          # api.cursor.com не имеет /chat/completions — это
#   #     model: auto                           # асинхронный run-based API: cursor-as-claude создаёт
#   #     url: https://api.cursor.com/v1        # no-repo Cloud Agent, опрашивает run, эмитит claude stream-json.
#   #     auth:                                 # auth.to — любой env:VAR; CURSOR_API_KEY по конвенции
#   #       from: "file:~/.ai-free/claude-glm/token-cursor"
#   #       to: "env:CURSOR_API_KEY"
#   #   codex:                                 # type:codex → OpenAI Codex CLI, БЕЗ секрета в конфиге:
#   #     type: codex                           # авторизация через смонтированное ~/.codex (ChatGPT-plan
#   #     model: gpt-5-codex                    # OAuth), afm монтирует его :ro только если флоу реально
#   #                                            # использует codex. model опционален ("" / "default" →
#   #                                            # решает сам codex/~/.codex/config.toml).
#   #     # auth: не указывается для codex (единственный тип, где auth необязателен)
#   #   # Для провайдеров с настоящим OpenAI /v1/chat/completions (deepseek, ollama, …) — type: openai:
#   #   # openai-agent:
#   #   #   type: openai
#   #   #   model: deepseek-chat
#   #   #   url: https://api.deepseek.com/v1
#   #   #   auth: { from: "env:DEEPSEEK_KEY", to: "env:OPENAI_API_KEY" }
#
#   # Доп. хост-директории для кастомных агентов (токены/конфиги вне ~/.claude,
#   # напр. ~/.ai-free для GLM-обёрток glm51/glm52). Пути с ~ → /home/afm/…, абсолютные —
#   # тот же путь; монтируются только для чтения. При autoShim:on для recipe-агентов
#   # токены идут через transient env — этот маунт им не нужен.
#   #
#   # extra_mounts поддерживает и старую scalar-форму (просто путь = browse:false,
#   # приватный mount), и объектную форму с явным browse — какие mount-ы видны в
#   # dashboard file browser (см. ниже), а какие остаются скрытыми (credentials/токены).
#   # extra_mounts:
#   #   - path: ../shared-contracts   # соседний code-репозиторий
#   #     name: contracts             # optional UI label; default = basename(path)
#   #     browse: true                # source mount — ВИДЕН в file browser (read-only)
#   #   - path: ~/.ai-free             # credential mount
#   #     browse: false                # смонтирован агенту, но НЕ виден в file browser (default)
#   #   - ~/.legacy-agent              # старый scalar-синтаксис — тоже означает browse:false
#
#   # File browser: только внутри Docker mode (нужен манифест от host launcher-а;
#   # на обычном host-запуске без Docker эта возможность отсутствует полностью —
#   # /api/files/* отдаёт 404, кнопки в dashboard нет).
#   # Показывает: lazy source tree project mount-а + extra_mounts с browse:true,
#   # текстовые файлы с подсветкой (Go/TypeScript/JavaScript/Python),
#   # HEAD → working tree diff, вставку [AFM file: "<container-path>"] ссылок
#   # в комментарии к плану/вопросу (агент читает файл сам, содержимое не копируется).
#   # Всегда read-only: .git и .afm скрыты из дерева, ни создать, ни изменить,
#   # ни удалить файл через dashboard нельзя. Лимиты: контент файла ≤ 2 MiB
#   # (крупнее — "file too large", но сослаться всё равно можно), diff ≤ 4 MiB
#   # (обрезается с баннером). Symlink виден в дереве, но не открывается.
#   # На Linux-host со старым kernel (< 5.6, без openat2) фича мягко выключается.
#   #
#   # По умолчанию ВЫКЛЮЧЕН — включается явно (enabled: true ниже) или env-переменной
#   # AFM_FILE_BROWSER. Приоритет: env AFM_FILE_BROWSER > config > default false.
#   # AFM_FILE_BROWSER=1/true форсирует включение поверх конфига, =0/false — выключение;
#   # пусто/не задано — решает config. Решение принимается на хосте до Docker re-exec.
#   #
#   # ВАЖНО: пока file browser включён, Docker публикует dashboard-порт только на
#   # loopback (-p 127.0.0.1:<port>:<port>) вместо 0.0.0.0 — dashboard перестаёт быть
#   # доступен из LAN. Запуски без file browser (по умолчанию) сохраняют прежнее
#   # поведение (0.0.0.0). Если фичу включили, но нужен LAN-доступ — SSH-туннель на loopback.
#   # file_browser:
#   #   enabled: true   # opt-in; по умолчанию OFF (env AFM_FILE_BROWSER перебивает)
