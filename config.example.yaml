# afm Configuration
# Place in: .afm/config.yaml (project-level) or ~/.afm/config.yaml (global)
# Project-level config overrides global. Missing fields keep defaults.

# AI client settings
client:
  # Command to run as the AI agent.
  # Default: "claude"
  command: claude

  # Extra arguments appended to the command.
  # Default: ["--print", "--output-format", "stream-json", "--verbose", "--dangerously-skip-permissions"]
  # (auto-added for "claude", override here for custom commands)
  # extra_args:
  #   - --my-custom-flag

# Execution parameters
executor:
  # Maximum idle time with no output from the agent before killing the process.
  # Default: 30m
  # idle_timeout: 30m

  # Maximum number of stages running in parallel (0 = unlimited).
  # Default: 0
  # max_parallel: 4

# Directory with custom prompt templates (overrides embedded defaults).
# Files needed: planning.md, implementation.md, review.md, summary.md
# Default: "" (use embedded prompts)
# prompts_dir: .afm/prompts/

# Built-in reverse proxy settings.
# The proxy intercepts agent HTTP traffic and applies transforms.
# Default: enabled when ANTHROPIC_BASE_URL is set or proxy.upstream is configured.
# proxy:
#   # Set to false to disable the proxy entirely.
#   # Default: true
#   # enabled: true
#
#   # Upstream Anthropic-compatible API base URL.
#   # Default: "" (reads from ANTHROPIC_BASE_URL environment variable)
#   # upstream: https://api.z.ai/api/anthropic
#
#   # Proxy listen port (0 = random free port).
#   # Default: 0
#   # port: 0
#
#   # Transform overrides. null/absent = auto-detect by upstream host.
#   # transforms:
#   #   zai: true   # force-enable ZAI fix (non-streaming→streaming for api.z.ai)
#   #   zai: false  # force-disable even when upstream is api.z.ai

# Docker mode — запускать afm и агентов внутри Docker-контейнера.
# Включается через конфиг или переменную окружения AFM_USE_DOCKER=1.
# docker:
#   # Включить Docker mode. nil/absent → смотрим $AFM_USE_DOCKER.
#   # Default: false
#   # enabled: true
#
#   # Docker-образ для запуска.
#   # Default: "akopichin/afm:latest" (или $AFM_DOCKER_IMAGE)
#   # image: akopichin/afm:latest
#
#   # Доп. хост-директории для кастомных агентов (токены/конфиги вне ~/.claude,
#   # напр. ~/.ai-free для GLM-обёрток glm51/glm52). Пути с ~ → /home/afm/…, абсолютные —
#   # тот же путь; монтируются только для чтения.
#   # extra_mounts:
#   #   - ~/.ai-free

# Учёт потребления (токены / стоимость / трафик).
# afm захватывает каждый проксированный ответ агента в usage.jsonl и отдаёт
# агрегаты через GET /api/usage?metric=tokens|cost|kb. Метрика cost считается
# только при заданном разделе pricing; без него cost полностью скрыт.
#
# КАК ОПРЕДЕЛЯЕТСЯ МОДЕЛЬ (ключ цены):
# Ключ обязан СТРОГО совпадать со значением поля `model` из ответа upstream-API —
# именно оно попадает в usage.jsonl (его же шлёт провайдер). Никакого fuzzy или
# сопоставления по префиксу: если API отдаёт "claude-sonnet-4-5-20250929", то и
# ключ должен быть таким же. Чтобы увидеть точную строку для своего агента —
# посмотри поле model в .afm/runs/<run>/usage.jsonl. Модели glm-* (напр. glm-5.2)
# совпадают как есть; у Claude API строка обычно с датой — добавь её сюда.
#
# Цены ОРИЕНТИРОВОЧНЫЕ (list price, интернет-источники на момент составления),
# USD за 1 млн токенов — проверяй актуальные у провайдера и поправь под себя.
# cache_per_mtok — единая ставка cache read/write (в Anthropic они различаются,
# тут усреднено ближе к read, т.к. чтений обычно больше).
pricing:
  models:
    # Anthropic Claude — platform.claude.com/docs/en/about-claude/pricing
    claude-opus-4-5:     { input_per_mtok: 5.0,  output_per_mtok: 25.0, cache_per_mtok: 0.5 }
    claude-sonnet-4-5:   { input_per_mtok: 3.0,  output_per_mtok: 15.0, cache_per_mtok: 0.3 }
    claude-sonnet-5:     { input_per_mtok: 2.0,  output_per_mtok: 10.0, cache_per_mtok: 0.2 }  # intro до 31.08.2026
    claude-haiku-4-5:    { input_per_mtok: 1.0,  output_per_mtok: 5.0,  cache_per_mtok: 0.1 }
    # OpenAI GPT — openai.com/api/pricing
    gpt-4o:              { input_per_mtok: 2.5,  output_per_mtok: 10.0, cache_per_mtok: 1.25 }
    gpt-4o-mini:         { input_per_mtok: 0.15, output_per_mtok: 0.6,  cache_per_mtok: 0.075 }
    # z.ai GLM — docs.z.ai/guides/overview/pricing (glm-5.2 нет в прайсе, ≈ по glm-4.6)
    glm-4.6:             { input_per_mtok: 0.6,  output_per_mtok: 2.2,  cache_per_mtok: 0.11 }
    glm-4.5:             { input_per_mtok: 0.6,  output_per_mtok: 1.1,  cache_per_mtok: 0.11 }
    glm-5.2:             { input_per_mtok: 0.6,  output_per_mtok: 2.2,  cache_per_mtok: 0.11 }

# Ширина бакета агрегации по времени (в минутах) для /api/usage и панели дашборда.
# Default: 5
# accounting:
#   bucket_minutes: 5
