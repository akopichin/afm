# afm Configuration
# Place in: .afm/config.yaml (project-level) or ~/.afm/config.yaml (global)
# Project-level config overrides global. Missing fields keep defaults.

# Web dashboard theme.
# "graphite"    — default product skin: material hierarchy on a cool graphite canvas,
#                 indigo interaction accent, mint success and amber attention (dark & light).
# "goga"        — flat dark tech theme (teal accent #20D4BF, sans-serif, Goga wordmark).
# "novacorps"   — hi-tech theme (mint accent, monospace font, scanline/neon decor).
# Light/dark mode is toggled inside the dashboard itself, independent of the theme.
# Any other or empty value → "graphite" (an unknown value logs a warning to stderr).
# The legacy "coffee" value is accepted as an alias that normalizes to "graphite".
# Default: "graphite"
# theme: graphite

# Fully custom dashboard skin: a directory containing index.css. Overrides `theme`.
# Default: "" (use the built-in theme)
# skin_dir: .afm/skin/

# Automatically reset failed stages back to pending on run start/resume (e.g. if the
# afm process/container was killed mid-run) — no manual `afm retry <id>` per failed
# stage. All failed stages are reset regardless of the failure cause; dependency
# order is preserved by the normal depends_on scheduler.
# Default: true
# auto_recover: true

# server:
#   # Open the dashboard in a browser automatically on startup.
#   # Default: false — the URL is printed to the log, open it manually.
#   # open_browser: true
#   # port: 9876

# AI client settings
client:
  # Command to run as the AI agent.
  # Default: "claude"
  command: claude

  # Extra arguments appended to the command.
  # Default: ["--print", "--output-format", "stream-json", "--verbose", "--dangerously-skip-permissions"]
  # (auto-added for "claude", override here for custom commands)
  # extra_args:
  #   - --my-custom-flag

  # claude_bare: whether to add --bare to generated claude wrappers (autoShim).
  # --bare = claude Code minimal mode: skips CLAUDE.md auto-discovery, SessionStart
  # hooks, skills listing, auto-memory (~120 KB of auto-context) — the request body
  # is ~4 KB instead of ~127 KB (fewer tokens, less gateway load, lower 529 risk).
  # BUT --bare breaks the Skill tool: skills stop resolving (the agent imitates them
  # itself). Default: false (skills matter more). Enable claude_bare: true only for
  # flows WITHOUT skills.
  # claude_bare: false

# Execution parameters
executor:
  # Maximum idle time with no output from the agent before killing the process.
  # Default: 30m
  # idle_timeout: 30m

  # Maximum number of stages running in parallel (0 = unlimited).
  # Default: 0
  # max_parallel: 4

  # Max chars for agent text/Bash-command detail logged to <phase>.log and the
  # agent_action event feed (0 = no limit — the full text/command is kept).
  # Default: 0
  # truncate_output: 100

# Directory with custom prompt templates (overrides embedded defaults).
# Recognized files: planning.md, implementation.md, review.md, summary.md,
# autonomous.md, reflect.md, aggregate.md, prioritize.md, update.md.
# The directory may be partial — any file that's absent falls back to the embedded
# default, so you can override just the prompts you care about.
# Default: "" (use embedded prompts)
# prompts_dir: .afm/prompts/

# Docker mode — run afm and the agents inside a Docker container.
# Enabled via this config or the AFM_USE_DOCKER=1 environment variable.
# docker:
#   # Enable Docker mode. nil/absent → falls back to $AFM_USE_DOCKER.
#   # Default: false
#   # enabled: true
#
#   # Docker image to run.
#   # Default: "akopichin/afm:latest" (or $AFM_DOCKER_IMAGE)
#   # image: akopichin/afm:latest
#
#   # Optional path to a file with secrets for autoShim auth.from lookups.
#   # Default: "" (secrets are read from the global ~/.afm and the recipe's own paths)
#   # secrets_file: ~/.afm/secrets.env
#
#   # autoShim: when set, afm generates claude wrappers for agents.<cmd> right inside
#   # the container — without mounting the binary and without extra_mounts for tokens.
#   # Requires an image built with autoShim support. A recipe = model + url +
#   # system_prompt(file:) + auth{from,to}. auth.from is a file path or env:VAR that
#   # afm reads the secret from ON THE HOST (the token value is never stored in the
#   # config — it enters the container as a transient env var). auth.to ∈
#   # {env:CLAUDE_CODE_OAUTH_TOKEN, env:ANTHROPIC_API_KEY, env:ANTHROPIC_AUTH_TOKEN}.
#   # model is set for all three tiers. url is baked into the wrapper as
#   # ANTHROPIC_BASE_URL (z.ai, deepseek — directly).
#   # autoShim: true
#   # agents:
#   #   glm52:                                  # example (paths are real; no token in the config)
#   #     model: glm-5.2
#   #     url: https://api.z.ai/api/anthropic
#   #     system_prompt: "file:~/.ai-free/claude-glm/system-prompt.md"
#   #     auth:
#   #       from: "file:~/.ai-free/claude-glm/token"
#   #       to: "env:ANTHROPIC_AUTH_TOKEN"
#   #   deepseek-v4:                            # docker-only (no host binary) + cross-gateway
#   #     model: deepseek-v4-pro
#   #     url: https://api.deepseek.com/anthropic
#   #     auth:
#   #       from: "file:~/.ai-free/claude-glm/token-deepseek"
#   #       to: "env:ANTHROPIC_AUTH_TOKEN"
#   #   cursor:                                # type:cursor → Cursor Cloud Agents API (NOT openai chat!)
#   #     type: cursor                          # api.cursor.com has no /chat/completions — it's an
#   #     model: auto                           # async run-based API: cursor-as-claude creates a
#   #     url: https://api.cursor.com/v1        # no-repo Cloud Agent, polls the run, emits claude stream-json.
#   #     auth:                                 # auth.to — any env:VAR; CURSOR_API_KEY by convention
#   #       from: "file:~/.ai-free/claude-glm/token-cursor"
#   #       to: "env:CURSOR_API_KEY"
#   #   codex:                                 # type:codex → OpenAI Codex CLI, NO secret in the config:
#   #     type: codex                           # auth via a mounted ~/.codex (ChatGPT-plan OAuth); afm
#   #     model: gpt-5-codex                    # mounts it :ro only if the flow actually uses codex.
#   #                                            # model is optional ("" / "default" → codex /
#   #                                            # ~/.codex/config.toml decides).
#   #     # auth: omitted for codex (the only type where auth is optional)
#   #   # For providers with a real OpenAI /v1/chat/completions (deepseek, ollama, …) — type: openai:
#   #   # openai-agent:
#   #   #   type: openai-agent          # real tool-loop (autonomous/interactive stages)
#   #   #   model: deepseek-chat
#   #   #   url: https://api.deepseek.com/v1
#   #   #   max_turns: 40               # openai-agent only: max tool-call iterations per invocation (default 40)
#   #   #   auth: { from: "env:DEEPSEEK_KEY", to: "env:OPENAI_API_KEY" }
#
#   # Extra host directories for custom agents (tokens/configs outside ~/.claude,
#   # e.g. ~/.ai-free for the GLM wrappers glm51/glm52). ~-paths → /home/afm/…,
#   # absolute paths → the same path; all mounted read-only. With autoShim on, recipe
#   # agents get their tokens via transient env — this mount isn't needed for them.
#   #
#   # extra_mounts accepts both the legacy scalar form (a bare path = browse:false, a
#   # private mount) and the object form with an explicit browse — controlling which
#   # mounts are visible in the dashboard file browser (see below) and which stay
#   # hidden (credentials/tokens).
#   # extra_mounts:
#   #   - path: ../shared-contracts   # a neighboring code repository
#   #     name: contracts             # optional UI label; default = basename(path)
#   #     browse: true                # source mount — VISIBLE in the file browser (read-only)
#   #   - path: ~/.ai-free             # credential mount
#   #     browse: false                # mounted to the agent, but NOT visible in the file browser (default)
#   #   - ~/.legacy-agent              # legacy scalar syntax — also means browse:false
#
#   # File browser: Docker mode only (it needs the manifest from the host launcher;
#   # a plain host run without Docker doesn't have this feature at all —
#   # /api/files/* returns 404 and there's no button in the dashboard).
#   # Shows: a lazy source tree of the project mount + extra_mounts with browse:true,
#   # text files with syntax highlighting (Go/TypeScript/JavaScript/Python),
#   # a HEAD → working tree diff, and inserting [AFM file: "<container-path>"] refs
#   # into plan/question comments (the agent reads the file itself; nothing is copied).
#   # Always read-only: .git and .afm are hidden from the tree; no create/edit/delete
#   # through the dashboard. Limits: file content ≤ 2 MiB (larger — "file too large",
#   # but still referenceable), diff ≤ 4 MiB (truncated with a banner). Symlinks are
#   # listed but not opened. On a Linux host with an old kernel (< 5.6, no openat2)
#   # the feature degrades off automatically.
#   #
#   # ON by default — turn it off explicitly (enabled: false below) or via the
#   # AFM_FILE_BROWSER env var. Priority: env AFM_FILE_BROWSER > config > default true.
#   # AFM_FILE_BROWSER=1/true force-enables over the config, =0/false force-disables;
#   # empty/unset → the config decides (enabled by default). The decision is made on
#   # the host before Docker re-exec.
#   #
#   # IMPORTANT: while the file browser is on (the default), Docker publishes the
#   # dashboard port on loopback only (-p 127.0.0.1:<port>:<port>) instead of 0.0.0.0 —
#   # the dashboard stops being reachable from the LAN. To restore 0.0.0.0, disable the
#   # browser (enabled: false or AFM_FILE_BROWSER=0). If you keep it on but need LAN
#   # access, use an SSH tunnel to loopback.
#   # file_browser:
#   #   enabled: false   # opt-out; ON by default (env AFM_FILE_BROWSER overrides)
