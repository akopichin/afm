name: some change
description: "theme switch change"

supervisor_command: claude

prompt: |
  if goga binary not installed - install it with `pip install goga && goga connect claude`
  constraint: пиши все на русском. Не используй английский кроме спец терминов нужных.

stages:
  - id: install-goga
    name: "Install goga"
    description: |
      Установить бинарь goga и подключить его к claude (skills/commands).
    script: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude

  - id: change
    name: "change"
    supervisor: true
    supervisor_prompt: скилл может сам все сделать - нужен autonomous режим.
    interactive: true
    agents: [planning]
    description: |
      засинкать codemanifest-ы с кодом.
    prompt: |
      сделать goga-change нужно перенести во всех скинах иконку смену темы вправо вверх. Обычно все иконки смены темы там находятся.
    skills:
      - goga-change
    command: claude
    script_before: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude
    depends_on: [install-goga]
  - id: accept
    name: "accept"
    supervisor: true
    supervisor_prompt: скилл может сам все сделать - нужен autonomous режим.
    interactive: true
    agents: [planning]
    description: |
      засинкать codemanifest-ы с кодом.
    prompt: |
      сделать goga-accept прочекать что все ок по арх с помощью него.
    skills:
      - goga-accept
    command: claude
    script_before: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude
    depends_on: [change]

  - id: commit
    name: "commit"
    supervisor: true
    supervisor_prompt: скилл может сам все сделать - нужен autonomous режим.
    interactive: true
    agents: [planning]
    description: |
      сделать коммит.
    prompt: |
      прогони lint/build
      обнови доку по этому изменению, напиши релиз нотсы.
      закоммитить все если все хорошо. Если нет - починить.
    command: claude
    script_before: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude
    depends_on: [accept]
