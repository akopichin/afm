# yaml-language-server: $schema=https://raw.githubusercontent.com/akopichin/afm/main/schema/flow.schema.json
#
# dev-pipeline — the repeatable "groom → ship" loop encoded as an afm flow.
#
#   plan (codex-reviewed)  →  implement (5-agent Claude review + go test + codex gate)
#                          →  live-run (exercise the real product; browser via afm_chrome)
#                          →  docs (update docs/changelog, codex-checked)
#                          →  commit (clean tree + git commit)
#
# Both stages are agents:[auto] + interactive:true so they run autonomously but can
# still ask YOU questions through the dashboard. The plan is handed to `implement`
# via artifacts/inputs (its contents are inlined into the implement prompt).
#
# Review authorities:
#   - Codex is the independent read-only gate on BOTH stages (verify steps).
#     A plan-only (agents:[planning]) stage cannot carry verify, which is why `plan`
#     is an auto stage — that is what lets codex review the plan as a real gate.
#   - The 5-perspective Claude review (correctness / architecture+simplicity /
#     security / tests / readability, 3 rounds) is not expressible as an afm verify
#     step (verify supports only codex in v1), so the implement agent runs it itself
#     by dispatching 5 subagents before it finishes — see its prompt.
#
# The `live-run` stage exercises the change on the REAL, freshly-built product right
# after the review. This used to be impossible from inside the flow (a host + human
# step), but afm can now drive a REAL browser from the container via the managed
# `afm_chrome` MCP (host-side Chrome), so a web/UI change is verified end-to-end here;
# the `live-run` skill launches/drives non-web changes (CLI/library/API) the
# appropriate way. For web/UI runs the managed browser must be available — set
# `browser.enabled: true` in config (or rely on auto on a host that has Chrome).
#
# Requires a `codex` CLI on PATH (host) or a `type: codex` autoShim recipe (Docker).
#
# Usage:
#   afm run dev-pipeline.yaml

name: dev-pipeline
description: "Codex-reviewed plan → autonomous TDD with a 5-agent Claude review and a codex gate"

# Изолировать запуск флоу в отдельном git worktree на ветке <flow-name>, чтобы
# main оставался нетронутым до стадии merge. Без этого флага merge-стадия no-op.
worktrees: true

# Agent memory — копит уроки каждого прогона в общий файл .memory/memory.md и
# подкладывает его в контекст стадий на следующих ранах (детали: docs/agent-memory.md).
#
# path резолвится ОТ КОРНЯ РАНА, а при worktrees:true корнем становится сам worktree
# (.worktrees/<branch>) — поэтому обычный относительный `.memory` уехал бы ВНУТРЬ
# воркти и память разъехалась бы по таскам. `../../.memory` поднимается на 2 уровня
# (.worktrees/<branch> → корень проекта) — единый .memory/memory.md для ВСЕХ прогонов.
#   mode: rw      — файл и читается в контекст, и перезаписывается в конце рана.
#   memory_use:true — мастер-свитч ЧТЕНИЯ (без него накопленное не подкладывается).
memory:
  path: ../../.memory
  mode: rw
  memory_use: true

# Shared instruction injected into every stage: the simplicity ladder is a hard
# requirement, not a preference. Overengineering and copy-paste are defects.
prompt: |
  Prefer the simplest thing that works. Simplicity ladder: remove code > add code;
  new file > modify existing; constant > variable; value > pointer; function >
  method/class; no mutation > copy-on-write > lock > atomic. Only escalate when the
  simple option provably fails. Do not introduce abstractions, layers, or generics
  that the task does not require. Consolidate duplicated logic into a shared
  primitive instead of copy-pasting. Write code a human can read easily.

  Convergence discipline (applies to EVERY review/correction cycle). The independent
  reviewer runs fresh each round with no memory of prior rounds, so if you chase it
  it will keep finding new, ever-subtler refinements forever and the stage will burn
  through its retries and fail. Do NOT ratchet scope or complexity to satisfy a
  reviewer. A finding is a BLOCKER only if it is a provable defect — wrong behavior,
  a real bug, a race, an unhandled error, a security hole, or a missing REQUIRED
  test. "Could be better", a speculative edge case, out-of-scope polish, or a
  request for more abstraction is NOT a blocker. You are allowed to DISMISS a
  non-blocking finding: do not touch the design, record a one-line rebuttal (see the
  per-stage note on where), and move on. Record each such rebuttal under the
  "## Review decisions (out of scope)" section ONLY if that exact point is not
  already recorded there — NEVER re-append an identical rebuttal. Once you have
  fixed every provable defect and recorded every disagreement, FINISH the stage
  without editing anything further and without asking a blocking question — do NOT
  stall the stage in awaiting_user_input. The human keeps full control from the
  dashboard (Pause/Revise) at any time, and the engine's review_patience backstop
  (see each stage's verify block) deterministically accepts the stage once the
  reviewer keeps rejecting but you have stopped changing the working tree
  (reviewer/author stalemate).

  Process safety (HARD RULE — a violation already destroyed a running pipeline).
  NEVER run broad process kills: no `pkill`/`killall`/`kill` by name or pattern
  (`pkill -f afm`, `pkill -f "afm.*run"`, `killall codex`, etc.). afm itself runs
  as `afm run …`, so ANY name/pattern kill matches the orchestrator running THIS
  flow and tears the whole pipeline down — taking you with it. If you genuinely
  must stop a process YOU started, capture its exact PID at launch
  (`mycmd & echo $!`) and `kill` only that single PID — never a pattern.

  Do NOT bootstrap your own `afm run` from inside a stage. Reproducing or
  regression-testing afm's own behavior (verify, docker, hooks, orchestration) is
  out of scope for every stage here and is exactly what leads to nested-afm +
  pkill cleanup disasters. Exercise the REAL product only in the dedicated
  `live-run` stage, via the `live-run` skill — never by spinning up a nested afm
  run and cleaning it up with a kill.

# Telegram-уведомления ТОЛЬКО для этого флоу (flow-слой hooks — получает события
# всех стадий). Скрипт afm-telegram-notify запечён в образ (Dockerfile.runtime) и
# симлинкнут на хостовый PATH, поэтому команда одинакова в Docker и на хосте.
# events: all — фильтрацию до «важных» событий делает сам скрипт. Секреты берутся
# из hook env:file: (afm резолвит на хосте и передаёт транспортом; в Docker-режиме
# ничего монтировать не нужно). Файлы секретов должны существовать:
#   ~/.afm/secrets/telegram-bot-token, ~/.afm/secrets/telegram-chat-id
hooks:
  - id: telegram
    events: all
    command: afm-telegram-notify
    env:
      TELEGRAM_BOT_TOKEN: "file:~/.afm/secrets/telegram-bot-token"
      TELEGRAM_CHAT_ID: "file:~/.afm/secrets/telegram-chat-id"

stages:
  # 1. Plan. An autonomous agent writes the plan to ./dev-plan.md and may ask you
  #    clarifying questions (interactive). The codex verify step is the independent
  #    read-only review of the plan — it loops up to 6 corrective rounds.
  - id: plan
    name: "Plan (codex-reviewed)"
    description: |
      Background: the planning stage. The output is an implementation plan file, not
      product code.
    command: architect
    agents: [auto]
    interactive: true
    skills:
      - superpowers:brainstorming
      - superpowers:writing-plans
    prompt: |
      FIRST, before anything else: you have NOT been told what to build. This flow
      carries no task input, so your very first action MUST be to ask the user, via
      the dialog protocol, what the task is — the feature, bug, or change to plan.
      Ask an open question with allow_custom enabled and NO pre-filled assumption
      about the goal; wait for the answer and treat it as the authoritative task.
      Never invent a task or plan against a guessed goal. If their answer is broad,
      ask focused follow-ups (scope, constraints, acceptance criteria) before
      planning.

      THEN write a concrete, step-by-step implementation plan to ./dev-plan.md in the
      project root. Split the work into independent tasks, each sized for ONE
      subagent and written test-first (TDD). Keep asking clarifying questions via the
      dialog protocol whenever scope, constraints, or acceptance criteria stay
      unclear — do not guess. Keep the design as simple as the problem allows: no
      unrequested abstractions, layers, or generics. Do NOT write product code in
      this stage — plan only.

      When codex verify rejects, judge each finding first and fix ONLY provable
      defects (see Convergence discipline above). For any finding that is out of
      scope, a refinement, or against the simplicity mandate, do NOT expand the plan
      to chase it — instead append it under a "## Review decisions (out of scope)"
      section at the end of ./dev-plan.md with a one-line reason, but ONLY if that
      exact point is not already recorded there (never re-append an identical
      rebuttal). codex reads this file every round, so this is how you stop it
      re-raising a settled point; once you stop editing, the review_patience
      backstop below accepts the plan.
    artifacts:
      - name: plan
        path: ./dev-plan.md
        description: "The implementation plan for the implement stage"
    verify:
      steps:
        - command: codex
          timeout: 15m
          prompt: |
            Read ./dev-plan.md and review the plan independently, read-only. Return
            МЕРДЖИТЬ if the plan is correct, safe and buildable, EVEN IF a more
            thorough plan is imaginable. Block (НЕ МЕРДЖИТЬ) ONLY on provable
            defects: an approach that would ship broken behavior, a real bug, a
            security hole, or a missing REQUIRED step/test. Do NOT block on
            refinements, speculative edge cases, extra tests/abstractions, unrelated
            refactoring, or "could be improved" — flag those at most as non-blocking
            notes. If the blockers you raised in a PRIOR round are addressed, return
            МЕРДЖИТЬ; do not introduce brand-new refinement-level blockers. If the
            plan has a "## Review decisions (out of scope)" section, treat those
            points as intentional and do not re-raise them. Verdict МЕРДЖИТЬ/НЕ
            МЕРДЖИТЬ + only genuinely blocking CRITICAL findings.
      # review_patience is the deterministic terminator (see the "two knobs" note on
      # the implement stage): once the plan agent stops editing ./dev-plan.md, codex is
      # accepted after 2 unchanged rounds. max_failures stays a generous ceiling.
      max_failures: 6
      review_patience: 2

  # 2. Implement. Autonomous TDD from the inlined plan. The agent runs the
  #    5-perspective Claude review itself (subagents) before finishing; then the
  #    verify gate runs go test + an independent codex review (up to 6 rounds).
  - id: implement
    name: "Implement: TDD + 5-agent Claude review + codex gate"
    depends_on: [plan]
    description: |
      Background: the implementation stage. The approved plan (from the plan stage)
      is inlined below and is the source of truth for what to build.
    command: developer
    agents: [auto]
    interactive: true
    inputs:
      - plan.plan
    skills:
      - superpowers:subagent-driven-development
      - superpowers:test-driven-development
      - superpowers:dispatching-parallel-agents
      - superpowers:requesting-code-review
      - superpowers:verification-before-completion
    prompt: |
      Implement the plan (inlined above) one task at a time, test-first: write the
      failing test BEFORE the implementation for each task. Do NOT add unrequested
      abstractions, layers, or generics — prefer deleting code over adding it, and
      consolidate any duplication into a shared primitive instead of copy-pasting.

      This stage runs more than once: your FIRST pass, then one corrective pass per
      codex verify rejection. Use a marker file to tell them apart so you don't
      re-review on every codex correction:

      FIRST decide which pass you are on — check whether the file
      "$AFM_STAGE_DIR/claude-review.done" exists.

      • If it does NOT exist → FIRST pass:
          1. Implement the plan (TDD). (Docs and CHANGELOG are handled by the
             separate `docs` stage after this one — do not write them here.)
          2. Run the Claude code review: dispatch 5 general-purpose subagents IN
             PARALLEL, one per perspective —
               (1) correctness & bugs,
               (2) architecture & simplicity / anti-overengineering,
               (3) security & data safety,
               (4) tests & coverage,
               (5) readability & maintainability
             — collect findings, fix every CRITICAL/major, and repeat for 3 rounds.
          3. As the LAST step before finishing, create the marker:
             `touch "$AFM_STAGE_DIR/claude-review.done"`.
          4. Finish. The codex verify gate then runs.

      • If it DOES exist → this is a CODEX-CORRECTION pass:
          Do NOT re-run the 5 subagent reviewers. Judge each codex finding first
          (see Convergence discipline above): FIX only provable defects and keep the
          tests green. For any finding that is out of scope, a refinement, or against
          the simplicity mandate, do NOT expand the code to chase it — append it
          under "## Review decisions (out of scope)" in ./dev-plan.md with a one-line
          reason, but ONLY if that exact point is not already recorded there (never
          re-append an identical rebuttal). codex reads the plan each round and will
          stop re-raising it. Then finish WITHOUT a blocking question — once you stop
          editing, the review_patience backstop accepts the stage. Codex re-checks on
          the next gate.
    verify:
      steps:
        - run: "go test ./..."
          timeout: 10m
        - command: codex
          timeout: 20m
          prompt: |
            Independent read-only review of this change against the plan
            (./dev-plan.md). Block (НЕ МЕРДЖИТЬ) ONLY on provable defects: bugs,
            races, unhandled errors, missing REQUIRED test cases, and security holes.
            You may flag copy-paste/duplication (recommend a shared primitive) and
            overengineering (needless abstractions, layers, generics, pointers where
            a value suffices) — but as NON-blocking notes, not grounds to reject. Do
            NOT require new abstractions, extra tests beyond the plan, or unrelated
            refactoring — reward deleting code. If the blockers you raised in a PRIOR
            round are addressed, return МЕРДЖИТЬ; do not introduce brand-new
            refinement-level blockers. If ./dev-plan.md has a "## Review decisions
            (out of scope)" section, treat those points as intentional and do not
            re-raise them. Verdict МЕРДЖИТЬ/НЕ МЕРДЖИТЬ + only genuinely blocking
            CRITICAL findings.
      # Two knobs, two jobs: go test (step 1) is the hard gate — a red test NEVER
      # passes and is never eligible for stalemate acceptance (shell steps are
      # excluded from review_patience). max_failures is a generous ceiling for the
      # genuinely-progressing case; review_patience is the DETERMINISTIC terminator:
      # once the agent fixes real defects, records (idempotent) rebuttals, and stops
      # editing, the working tree freezes and the stage is accepted after 2 unchanged
      # codex rounds. go test MUST stay step 1 (before codex) so the shell gate runs
      # every pass.
      max_failures: 6
      review_patience: 2

  # 3. Live run. Exercise the implemented change on the REAL product (built from the
  #    current sources — never a pinned image). afm can drive a real host-side Chrome
  #    from inside the container via the managed `afm_chrome` MCP, so a web/UI change
  #    is verified end-to-end here; non-web changes are launched/driven by the
  #    `live-run` skill. This is a human-in-the-loop checkpoint (interactive): a PASS
  #    proceeds to docs/commit, a FAIL stops for YOU via the dialog.
  - id: live-run
    name: "Live run (real product; browser via afm_chrome)"
    depends_on: [implement]
    description: |
      Background: the live-run stage. The code is implemented and reviewed; this
      stage runs the real product and checks the change actually works end-to-end.
    agents: [auto]
    interactive: true
    skills:
      - live-run
    prompt: |
      Exercise the implemented change on the REAL product, built from the CURRENT
      sources (never a pinned/prebuilt image). Follow the `live-run` skill to pick how
      to launch and drive the app based on what the change actually touched:

      - For a web/UI-facing change: use the managed Chrome DevTools MCP `afm_chrome`
        (a real browser on the host). Serve the app under test on
        $AFM_BROWSER_APP_PORT inside the container and open $AFM_BROWSER_APP_URL in
        the browser (NOT the container's own localhost, NOT host.docker.internal).
        Walk the exact user scenario the change affects and check console + network.
      - For a non-web change (CLI / library / API): launch and drive it the
        appropriate way per the skill; the managed browser is not required there.

      Capture evidence into $AFM_STAGE_DIR (a screenshot for UI runs, plus any
      console/network notes) and write $AFM_STAGE_DIR/execution_summary.md whose LAST
      line is exactly `## Verdict: PASS` or `## Verdict: FAIL`, with the concrete
      observed result that justifies it.

      Gate — do NOT fake a pass. If the scenario fails, or the change is web/UI-facing
      but the managed browser is unavailable (check `afm browser status --json`),
      write `## Verdict: FAIL` with the reason AND ask the user via the dialog protocol
      how to proceed (retry after a fix / override / abort) BEFORE finishing — this is
      a real human checkpoint, so stalling here for input is correct. Finish without
      asking ONLY when the verdict is PASS.

  # 4. Docs & changelog. A separate closing stage: update user-facing docs and the
  #    changelog to match the shipped change. Its codex verify step independently
  #    checks that the docs/changelog are accurate and present.
  - id: docs
    name: "Docs & changelog"
    depends_on: [live-run]
    description: |
      Background: the documentation stage. The code is already implemented and
      reviewed; this stage makes the docs and changelog match it.
    command: docfixer
    agents: [auto]
    interactive: true
    prompt: |
      Inspect the implemented change (e.g. `git diff` against the base branch) and
      bring the documentation in line with it:
        - Update any affected docs (docs/*.md, README, etc.) if behavior changed.
        - Add a CHANGELOG.md entry in ENGLISH under a dated `## YYYY-MM-DD` section
          using `### Improvement:` / `### Fix:` (newest section on top). Do not
          reference keepachangelog.com.
      If the change is genuinely user-invisible (pure internal refactor with no
      behavior change), it is fine to make no changelog entry — say so explicitly.
      Keep docs concise and accurate; do not invent behavior that isn't in the code.
    verify:
      steps:
        - command: codex
          timeout: 15m
          prompt: |
            Read-only review of the docs/changelog update against the actual code
            change (git diff). Block only if the docs describe behavior that does
            not match the code, or a user-facing change is missing its CHANGELOG
            entry. Do not demand extra prose or stylistic polish. If the blockers you
            raised in a PRIOR round are addressed, return МЕРДЖИТЬ; do not introduce
            brand-new refinement-level blockers. Verdict МЕРДЖИТЬ/НЕ МЕРДЖИТЬ + only
            genuinely blocking CRITICAL findings.
      max_failures: 2

  # 5. Commit & cleanup. The closing stage: tidy the working tree of pipeline
  #    junk, then commit the finished change. Its codex verify step independently
  #    checks the resulting commit is clean, coherent, and leaks nothing.
  - id: commit
    name: "Commit & cleanup"
    depends_on: [docs]
    description: |
      Background: the wrap-up stage. Code, docs and changelog are done and
      reviewed; this stage cleans the tree of leftovers and records the change
      as a git commit.
    command: developer
    agents: [auto]
    interactive: true
    prompt: |
      Wrap up the finished change with a clean git commit. Steps:

      1. Inspect the tree: `git status` and `git diff` (staged + unstaged).
      2. Clean up JUNK only — files that are pipeline leftovers or scratch, NOT
         part of the deliverable: the planning artifact ./dev-plan.md, stray
         temp/debug/scratch files, editor cruft (.DS_Store), build output that
         isn't meant to be tracked. NEVER delete tracked source, tests, docs, or
         anything the change legitimately produced. When unsure whether a file is
         junk, ask via the dialog protocol instead of deleting it.
      3. Stage exactly the intended change (the code + tests + docs/changelog from
         the previous stages) and NOTHING else — no secrets, no local config
         (.afm/, tokens), no unrelated edits. Double-check with `git diff --cached`
         before committing.
      4. Commit. The commit message MUST be in RUSSIAN (заголовок + при нужде тело
         с обоснованием). Do NOT add any `Co-Authored-By` trailer. Do NOT push —
         leave pushing to the user.
      5. Confirm: after the commit, `git status` should show a clean tree (only
         intentionally-ignored files remain). Report the commit hash and subject.

      If there is nothing to commit (tree already clean / no change), say so
      explicitly and do not create an empty commit.

  # 6. Merge into main (worktree runs only). When this flow runs inside a git
  #    worktree (worktrees: true), its work lives on branch <flow-name> while main is
  #    checked out in the project root — so you cannot `git checkout main` here. With
  #    your go-ahead, this stage folds the branch into main the conflict-safe way:
  #    resolve in the feature branch, prove tests green, then fast-forward main. main
  #    never enters a conflicted state. Local only — it NEVER pushes. When the flow is
  #    not in a worktree, the stage no-ops without asking.
  - id: merge
    name: "Merge into main (worktree only)"
    depends_on: [commit]
    description: |
      Background: the merge stage. The change is committed on this flow's branch. If
      the flow is running in a git worktree, this stage can fold that branch into the
      local `main` branch (no push). If it is not in a worktree, there is nothing to
      do.
    command: developer
    agents: [auto]
    interactive: true
    prompt: |
      This stage folds this flow's committed work into the local `main` branch, but
      ONLY when the flow is running inside a dedicated git worktree. It NEVER pushes.

      STEP 1 — detect. Determine whether you are in a linked worktree on a feature
      branch:
        - current branch:  `git rev-parse --abbrev-ref HEAD`
        - worktrees:       `git worktree list --porcelain`
      You are in scope ONLY IF the current branch is NOT `main` AND the current
      working tree is a LINKED worktree (not the main one) AND a local `main` branch
      exists. If any of that is false (worktrees were off, you are already on main, or
      there is no main branch), DO NOTHING: report "not in a worktree — nothing to
      merge" and finish WITHOUT asking a question.

      STEP 2 — ask. If in scope, ask the user via the dialog protocol whether to merge
      <current-branch> into main. Offer two options (allow_custom on):
        - "Merge <branch> into main (recommended)"
        - "Leave the branch for manual merge"
      If they decline, finish and report the branch name so they can merge by hand. Do
      NOT merge.

      STEP 3 — merge (only if they said yes). Do it the conflict-safe way so `main`
      never ends up in a conflicted state:

        a. Find the main working tree path from `git worktree list --porcelain` (the
           entry on branch `main`). Confirm it is clean: `git -C <main-root> status
           --porcelain` must be empty. If it is dirty, do NOT touch it — ask the user
           via the dialog how to proceed (they clean it up / abort) and finish.

        b. In THIS worktree, pull main's latest into the feature branch:
           `git merge --no-edit main`. If another feature merged into main before you,
           its changes arrive here and any conflicts surface HERE. Resolve every
           conflict CAREFULLY by understanding both sides (never blindly pick one);
           preserve the intent of BOTH changes. Then commit the merge.

        c. Prove it still works: run `go test ./...`. If anything fails, FIX it (the
           merge resolution is yours to correct) until green. Do not proceed with red
           tests.

        d. Fast-forward main onto the feature branch from the main working tree:
           `git -C <main-root> merge --ff-only <current-branch>`. Because step (b)
           made the feature branch contain all of main, this is always a clean
           fast-forward — main's working tree never sees a conflict. If git still
           refuses --ff-only for an unexpected reason, STOP and ask the user via the
           dialog rather than forcing it.

      Do NOT push — leave that to the user. When done, report: the branch merged, the
      resulting main HEAD (`git -C <main-root> rev-parse --short HEAD`), and that no
      push was performed.
