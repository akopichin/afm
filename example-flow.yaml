# Пример flow.yaml — добавление фичи авторизации через JWT
#
# Использование:
#   flowmanager run example-flow.yaml
#   flowmanager approve backend-auth   # после просмотра плана
#   flowmanager check                  # статус выполнения
#
# Или положить в .flowManager/flows/ — тогда run без аргументов сам найдёт.

name: jwt-auth
description: "Реализация JWT-авторизации: middleware, эндпоинты логина/логаута, тесты"

stages:

  # ──────────────────────────────────────────────────
  # Стадия 1: бэкенд — JWT middleware и эндпоинты
  # ──────────────────────────────────────────────────
  - id: backend-auth
    name: "JWT Middleware & Auth Endpoints"
    description: |
      Реализуй JWT-авторизацию:
      1. Пакет internal/auth — генерация и валидация токенов (библиотека golang-jwt/jwt).
      2. HTTP middleware CheckJWT: проверяет заголовок Authorization: Bearer <token>.
      3. POST /auth/login  — принимает {username, password}, возвращает {token}.
      4. POST /auth/logout — инвалидация токена (blacklist in-memory или Redis).
      5. Все эндпоинты покрыть unit-тестами (coverage ≥ 80%).
    agents: [planning, implementation, review]
    # skills — дополнительные инструкции для агента (опционально)
    skills:
      - superpowers:test-driven-development

  # ──────────────────────────────────────────────────
  # Стадия 2: фронтенд — форма входа
  # Запускается только после завершения backend-auth
  # ──────────────────────────────────────────────────
  - id: frontend-login
    name: "Login Form UI"
    description: |
      Реализуй форму входа:
      1. Компонент LoginPage (React + TypeScript).
      2. Поля email и password с валидацией (react-hook-form + zod).
      3. При успехе — сохранить JWT в httpOnly cookie через API-прокси.
      4. При ошибке — показать понятное сообщение.
      5. Юнит-тесты компонента (vitest + testing-library).
    agents: [planning, implementation, review]
    depends_on: [backend-auth]

  # ──────────────────────────────────────────────────
  # Стадия 3: интеграционные тесты
  # Запускается после обеих предыдущих стадий
  # ──────────────────────────────────────────────────
  - id: integration-tests
    name: "E2E Integration Tests"
    description: |
      Напиши интеграционные тесты полного цикла авторизации:
      1. Успешный логин → получение токена → запрос к защищённому эндпоинту.
      2. Логин с неверным паролем → 401.
      3. Запрос без токена → 401.
      4. Запрос с истёкшим токеном → 401.
      5. Логаут → повторное использование токена → 401.
      Используй testcontainers-go если нужна БД.
    agents: [planning, implementation]
    depends_on: [backend-auth, frontend-login]


# ──────────────────────────────────────────────────────────────────────────────
# Пример стадии с готовым планом (пропускает planning agent):
#
#   - id: db-migration
#     name: "Database Migration"
#     description: "Применить миграцию схемы для таблицы users"
#     agents: [implementation]
#     plan: docs/plans/db-migration.md   # агент планирования не запускается
#
# Пример параллельных независимых стадий (без depends_on):
#
#   - id: update-docs
#     name: "Update Docs"
#     description: "Обновить README и OpenAPI-спецификацию"
#     agents: [planning, implementation]
#
