# Интерактивный demo-flow — проверка диалогового стейджа
#
# Использование:
#   afm run example-flow-interactive.yaml
#   # открыть dashboard, ответить на вопросы в секции «Диалог»

name: interactive-demo
description: "Demo интерактивного стейджа"

stages:
  - id: discovery
    name: "Сбор требований"
    description: |
      Спроси у пользователя:
      1. Какой язык программирования предпочитает (предложи Go, Python, TypeScript).
      2. Какой стиль архитектуры (предложи monolith, microservices, "не знаю").

      Для каждого вопроса используй файловый протокол диалога:
      - запиши $AFM_STAGE_DIR/implementation.q1.question.json
        (формат: {"id":"q1","question":"...","options":["Go","Python","TypeScript"],"allow_custom":true})
      - дождись ответа: while [ ! -f "$AFM_STAGE_DIR/implementation.q1.answer.json" ]; do sleep 30; done
      - повтори для q2 (архитектура)

      После двух ответов запиши итог в ./summary.md в формате:
        # Сводка
        - Язык: <ответ>
        - Архитектура: <ответ>

      Когда summary.md записан — заверши работу (создай .done).
    agents: [implementation]
    interactive: true
    artifacts:
      - name: summary
        path: ./summary.md
        description: "Сводка ответов"
