# yaml-language-server: $schema=https://raw.githubusercontent.com/akopichin/afm/main/schema/flow.schema.json
# Team review example: the stage agent asks two run agents from team: for a review, waits for both
# answers, fixes what is valid, then a verify gate checks the result. Profiles live in .afm/config.yaml.

name: agent-team-review
description: "Demo: a stage agent asks a team of reviewer agents for feedback before it finishes"

# Run agents afm adds before the first stage starts. Each @name comes from the title:
# @architecture and @qa (or @qa-2 and so on when the name is taken).
# Replace with your own agents/models: point profile at any role in collaboration.profiles.
team:
  - id: arch
    profile: rev-arch
    title: Architecture
    instruction: Review the change you are asked about for simplicity and duplication.
  - id: qa
    profile: rev-qa
    title: QA
    instruction: Review the change you are asked about for edge cases and test coverage.

stages:
  - id: implement
    name: "Implement Slugify with a team review"
    agents: [auto]
    description: |
      Implement a function Slugify(s string) string in ./slug.go: lower-case the
      text, replace every run of characters that are not letters or digits with a
      single "-", and trim "-" from both ends ("  Hello, World! " -> "hello-world").
      Add a table-driven test in ./slug_test.go. If there is no go.mod, create one
      with `go mod init example.com/slug`.

      You may be resumed several times: each reviewer's answer starts a new turn.
      Start every turn by checking where the review stands: read <your_requests>
      in your instructions (the requests you already sent and their answers) and
      run `afm agent inbox`. Do not redo finished steps:
      - Both reviewers answered your latest requests and there is nothing left
        to fix: finish now (step 5).
      - A request is still waiting for its answer: handle the answers you have
        (step 4), then end your turn without sending anything new.
      - A request ended without an answer (<your_requests> says its wait was
        cancelled or expired, e.g. the reviewer failed or left the run): that
        reviewer is unavailable. Do not ask it again; once no other request is
        waiting, finish and say in your summary which review did not happen
        and why.
      - You have not asked yet: implement and test, then go on with step 1.

      When the code builds and `go test ./...` passes, ask the team for a review.
      Write every message in English.

      1. Run `afm agent list` and find the aliases of the two reviewers, by
         default `architecture` and `qa`. If it reports that messaging is
         unavailable (collaboration is off, so there is no team), skip the
         review: finish with the code, the tests and the verify gate, and say
         in your summary that no team review took place and why.
      2. Send each reviewer its own request with the same change summary (what
         changed, which files, how you tested it):

           afm agent send --to architecture --kind request --body "<summary>"
           afm agent send --to qa --kind request --body "<summary>"

         Each command prints a `message_id`.
      3. For each `message_id`, register a wait for its answer:

           afm agent wait --condition reply_to --message-id <message_id>

         Then END YOUR TURN. Do not poll. Each answer resumes you with the reply
         in your inbox. If a wait reports `ready`, the answer is already there:
         read it with `afm agent inbox`.
      4. For each answer, fix the findings that are valid and run the tests
         again. If you changed code because of a reviewer, send that reviewer a
         new request with what you changed and wait for it again (steps 2-3, at
         most two rounds per reviewer).
      5. While a wait is still open, end your turn again after handling a reply.
         Finish once every request is answered or ended without an answer.
         Never send a new request to a reviewer whose latest answer had no
         findings. In your summary, list the findings you fixed and the ones
         you declined, with a reason.

    # Runs after the agent finishes: a test gate, then a read-only AI review.
    verify:
      - run: "go test ./..."
        timeout: 5m
      - command: codex-as-claude
        timeout: 15m
        prompt: |
          Check Slugify against the stage's requirements and its tests. Block only
          provable bugs or missing required behavior; do not ask for unrelated
          refactoring.
