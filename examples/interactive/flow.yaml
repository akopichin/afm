# yaml-language-server: $schema=https://raw.githubusercontent.com/akopichin/afm/main/schema/flow.schema.json
# Interactive demo flow — exercises the file-based dialog protocol
#
# Usage:
#   afm run examples/interactive/flow.yaml
#   # open the dashboard and answer the questions in the "Dialog" panel

name: interactive-demo
description: "Demo of an interactive stage"

stages:
  - id: discovery
    name: "Gather Requirements"
    description: |
      Ask the user:
      1. Which programming language they prefer (offer Go, Python, TypeScript).
      2. Which architecture style (offer monolith, microservices, "not sure").

      For each question use the file-based dialog protocol:
      - write $AFM_STAGE_DIR/implementation.q1.question.json
        (format: {"id":"q1","question":"...","options":["Go","Python","TypeScript"],"allow_custom":true})
      - wait for the answer: while [ ! -f "$AFM_STAGE_DIR/implementation.q1.answer.json" ]; do sleep 30; done
      - repeat for q2 (architecture)

      After both answers, write the result to ./summary.md in this format:
        # Summary
        - Language: <answer>
        - Architecture: <answer>

      Once summary.md is written — finish (create .done).
    agents: [implementation]
    interactive: true
    artifacts:
      - name: summary
        path: ./summary.md
        description: "Summary of the answers"
