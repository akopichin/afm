# yaml-language-server: $schema=https://raw.githubusercontent.com/akopichin/afm/main/schema/flow.schema.json
# Example flow.yaml — adding JWT authentication as a feature
#
# Usage:
#   afm run examples/basic/flow.yaml   # then approve each plan in the dashboard
#   afm check                          # run status
#
# While `afm run` is active it holds an exclusive lock — approve via the dashboard.
# The CLI `afm approve <stage>` is for headless use, after the run process stops.
#
# Or drop it in .afm/flows/ — then `afm run` (no argument) finds it.

name: jwt-auth
description: "JWT authentication: middleware, login/logout endpoints, tests"

# prompt — an optional global instruction. It's added to the system prompt of EVERY
# stage and every phase (planning/implementation/review) as a <global_prompt> block
# right after </system_rules>. An empty/absent field changes nothing. It can be a
# single line (prompt: "...") or a block (|).
prompt: |
  Rules for the whole flow:
  - Go code in the project's style: gofmt + golangci-lint clean.
  - Every exported function and type has a godoc comment.
  - Do not change the Go version in go.mod without an explicit requirement.

stages:

  # ──────────────────────────────────────────────────
  # Stage 1: backend — JWT middleware and endpoints
  # ──────────────────────────────────────────────────
  - id: backend-auth
    name: "JWT Middleware & Auth Endpoints"
    description: |
      Implement JWT authentication:
      1. Package internal/auth — token generation and validation (golang-jwt/jwt).
      2. HTTP middleware CheckJWT: validates the Authorization: Bearer <token> header.
      3. POST /auth/login  — accepts {username, password}, returns {token}.
      4. POST /auth/logout — token invalidation (in-memory blacklist or Redis).
      5. Cover all endpoints with unit tests (coverage ≥ 80%).
    agents: [planning, implementation, review]
    # skills — extra instructions for the agent (optional)
    skills:
      - superpowers:test-driven-development
    # artifacts — files this stage produces for downstream stages
    artifacts:
      - name: api-contract
        path: docs/api-contract.yaml
        description: "OpenAPI specification for the auth endpoints"

  # ──────────────────────────────────────────────────
  # Stage 2: frontend — login form
  # Starts only after backend-auth completes
  # ──────────────────────────────────────────────────
  - id: frontend-login
    name: "Login Form UI"
    description: |
      Implement the login form:
      1. A LoginPage component (React + TypeScript).
      2. Email and password fields with validation (react-hook-form + zod).
      3. On success — store the JWT in an httpOnly cookie via an API proxy.
      4. On error — show a clear message.
      5. Unit tests for the component (vitest + testing-library).
    agents: [planning, implementation, review]
    depends_on: [backend-auth]
    # inputs — artifacts from dependency stages, spliced into the prompt
    inputs:
      - backend-auth.api-contract
    # This stage's planning starts after backend-auth completes;
    # eager_planning: true — plan immediately, without waiting.

  # ──────────────────────────────────────────────────
  # Stage 3: integration tests
  # Starts after both previous stages
  # ──────────────────────────────────────────────────
  - id: integration-tests
    name: "E2E Integration Tests"
    description: |
      Write integration tests for the full auth cycle:
      1. Successful login → obtain token → request a protected endpoint.
      2. Login with a wrong password → 401.
      3. Request without a token → 401.
      4. Request with an expired token → 401.
      5. Logout → reuse the token → 401.
      Use testcontainers-go if you need a database.
    agents: [planning, implementation, review]
    depends_on: [backend-auth, frontend-login]


# ──────────────────────────────────────────────────────────────────────────────
# Example of a stage with a ready-made plan (skips the planning agent):
#
#   - id: db-migration
#     name: "Database Migration"
#     description: "Apply the schema migration for the users table"
#     agents: [implementation]
#     plan: docs/plans/db-migration.md   # the planning agent does not run
#
# Example of parallel independent stages (no depends_on):
#
#   - id: update-docs
#     name: "Update Docs"
#     description: "Update the README and OpenAPI spec"
#     agents: [planning, implementation]
#
# Example of a stage with a verify command (a gate against a false "done"):
# the command runs in the project directory after the agent writes .done;
# a non-zero exit → one agent retry with the command output, then the stage fails.
#
#   - id: fix-tests
#     name: "Fix Tests"
#     description: "Fix the failing tests"
#     agents: [planning, implementation]
#     verify: ".venv/bin/python -m pytest tests/ -q"
#
# ──────────────────────────────────────────────────────────────────────────────
