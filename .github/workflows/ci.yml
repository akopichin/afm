name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pkg/web/dashboard/package-lock.json

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: UI unit tests
        run: make web-test

      - name: UI typecheck
        run: make web-typecheck

      - name: SDK tests
        run: make sdk-test

      - name: Lint
        run: make lint-ci

  auto-release-tag:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "afm-release-bot"
          git config user.email "afm-release-bot@users.noreply.github.com"

      - name: Bump and push patch tag
        run: ./scripts/release.sh patch
