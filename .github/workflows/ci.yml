name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: contracts/go.mod
          cache-dependency-path: |
            contracts/go.sum
            sdk/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pkg/web/dashboard/package-lock.json
      - name: Public contracts
        run: cd contracts && go test -race -timeout 15m ./...
      - name: SDK unit tests
        run: cd sdk && go test -race ./...
      - name: Dashboard
        run: |
          cd pkg/web/dashboard
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Public source boundary
        run: |
          python3 scripts/check-public-tree.py
          python3 scripts/sync-schemas.py --check

  request-engine-build:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'akopichin/afm'
    runs-on: ubuntu-latest
    steps:
      - name: Request private validation without publication
        env:
          GH_TOKEN: ${{ secrets.ENGINE_BUILD_DISPATCH_TOKEN }}
          AFM_REVISION: ${{ github.sha }}
          ENGINE_BUILD_REF: ${{ vars.ENGINE_BUILD_REF }}
        run: |
          : "${GH_TOKEN:?Set the ENGINE_BUILD_DISPATCH_TOKEN repository secret}"
          : "${ENGINE_BUILD_REF:?Set the ENGINE_BUILD_REF repository variable}"
          gh api --method POST repos/akopichin/afm-engine/actions/workflows/afm-release.yml/dispatches \
            -f "ref=$ENGINE_BUILD_REF" \
            -f "inputs[afm_revision]=$AFM_REVISION" \
            -f 'inputs[publish]=false'
