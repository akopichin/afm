name: Contracts CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: contracts/go.mod
          cache-dependency-path: contracts/go.sum
      - name: Build public contracts
        working-directory: contracts
        run: go build ./...
      - name: Test public contracts
        working-directory: contracts
        run: go test -race -timeout 15m ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: contracts
      - name: Check source formatting
        run: git diff --exit-code
