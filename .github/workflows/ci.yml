name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: contracts/go.mod
          cache-dependency-path: |
            contracts/go.sum
            sdk/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pkg/web/dashboard/package-lock.json
      - name: Public contracts
        run: cd contracts && go test -race -timeout 15m ./...
      - name: SDK unit tests
        run: cd sdk && go test -race ./...
      - name: Dashboard
        run: |
          cd pkg/web/dashboard
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Public source boundary
        run: |
          python3 scripts/check-public-tree.py
          python3 scripts/sync-schemas.py --check
