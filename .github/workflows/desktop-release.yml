name: AFM Desktop release

on:
  push:
    tags: ['ds-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version to validate without publishing
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('ds-v{0}', inputs.version) }}

jobs:
  afm-intel:
    name: Build AFM for Intel macOS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/akopichin/afm-engine
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the AFM source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the AFM dashboard
        run: |
          npm ci --prefix pkg/web/dashboard
          npm run build --prefix pkg/web/dashboard
      - uses: ./.github/actions/private-go
        with:
          token: ${{ secrets.ENGINE_READ_TOKEN }}
      - name: Cross-build the Intel AFM executable
        env:
          GOOS: darwin
          GOARCH: amd64
        run: npm run sidecar --prefix desktop
      - name: Remove module credentials
        if: always()
        run: rm -f "$HOME/.netrc"
      - name: Hash the Intel executable
        working-directory: desktop/dist/sidecars/darwin-x64
        run: sha256sum afm > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: afm-darwin-amd64-${{ github.sha }}
          path: |
            desktop/dist/sidecars/darwin-x64/afm
            desktop/dist/sidecars/darwin-x64/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/desktop-build.yml
    with:
      os: ${{ matrix.os }}
      release_tag: ${{ github.event_name == 'push' && github.ref_name || format('ds-v{0}', inputs.version) }}
    secrets:
      ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}

  build-intel:
    needs: afm-intel
    uses: ./.github/workflows/desktop-build.yml
    with:
      os: macos-15-intel
      release_tag: ${{ github.event_name == 'push' && github.ref_name || format('ds-v{0}', inputs.version) }}

  publish:
    if: github.event_name == 'push'
    needs: [build, build-intel]
    environment: afm-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify distribution approval
        env:
          DISTRIBUTION_APPROVED: ${{ vars.AFM_DISTRIBUTION_APPROVED }}
        run: test "$DISTRIBUTION_APPROVED" = true
      - uses: actions/download-artifact@v4
        with:
          pattern: afm-desktop-*
          merge-multiple: true
          path: release
      - name: Publish AFM Desktop archives
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          prefix="afm-desktop-${RELEASE_TAG#ds-v}"
          archives=("$prefix"-darwin-{arm64,x64}.zip "$prefix"-linux-{arm64,x64}.tar.gz)
          sha256sum "${archives[@]}" > SHA256SUMS
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
              cmp SHA256SUMS "$RUNNER_TEMP/SHA256SUMS"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AFM Desktop ${RELEASE_TAG#ds-v}" \
              --notes "Download the archive for your OS and CPU. The macOS app is ad-hoc signed and has no Apple notarization."
          fi
          gh release upload "$RELEASE_TAG" "${archives[@]}" SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
      - name: Update the AFM Desktop Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 scripts/publish-cask.py "$RELEASE_TAG" release
