name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Request trusted product build
        env:
          GH_TOKEN: ${{ secrets.ENGINE_BUILD_DISPATCH_TOKEN }}
          AFM_REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          ENGINE_BUILD_REF: ${{ vars.ENGINE_BUILD_REF }}
        run: |
          test -n "$ENGINE_BUILD_REF"
          gh api --method POST repos/akopichin/afm-engine/actions/workflows/afm-release.yml/dispatches \
            -f "ref=$ENGINE_BUILD_REF" \
            -f "inputs[afm_revision]=$AFM_REVISION" \
            -f "inputs[release_tag]=$RELEASE_TAG" \
            -f 'inputs[publish]=true'
