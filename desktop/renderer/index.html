<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'self' http://127.0.0.1:* http://localhost:* http://[::1]:*; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFM Desktop · Projects</title>
  <link rel="icon" href="../.generated/dashboard/favicon.svg">
  <link rel="stylesheet" href="../.generated/dashboard/skins/graphite/index.css">
  <link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="select.css">
</head>
<body>
<header class="shellbar">
  <button class="brand" id="home" title="All projects" aria-label="AFM Desktop home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/><circle cx="12" cy="12" r="2.5"/></svg>
    <b>afm</b><span>Desktop</span>
  </button>
  <div id="attention" hidden>
    <button id="next-notice" aria-label="Open next notification"><i class="dot"></i><span id="notice-count"></span></button>
    <button id="all-notices" aria-label="Show notification queue" aria-expanded="false" aria-controls="notice-list">⌄</button>
    <div id="notice-list" hidden></div>
  </div>
  <div id="crumb"></div>
  <div class="spacer"></div>
  <button class="switch" id="quick"><span aria-hidden="true">⌕</span> <span class="switch-label">Switch project</span><kbd></kbd></button>
  <button class="switch assistant-toggle" id="assistant-toggle" aria-keyshortcuts="Alt+A" aria-label="AFM Assistant" aria-controls="assistant" aria-expanded="false"><span aria-hidden="true">✧</span> Assistant</button>
  <button class="icon" id="settings-toggle" title="Settings" aria-label="Settings">⚙</button>
</header>
<div id="native-error" role="status" hidden></div>
<div class="app-body"><div class="main-column">
<main id="screen"></main>
<div id="dashboard-host" hidden></div>
</div>
<aside id="assistant" hidden aria-labelledby="assistant-title">
  <div id="assistant-resizer" class="rail-resizer" role="separator" aria-label="Assistant width" aria-controls="assistant" aria-orientation="vertical" tabindex="0"><span class="rail-resizer-grip" aria-hidden="true"></span></div>
  <div class="pane-head"><div><h2 id="assistant-title">AFM Assistant</h2><small id="chat-context"></small></div><button class="icon" id="close-chat" aria-label="Close assistant">×</button></div>
  <div id="messages" role="log" aria-live="polite"></div>
  <div class="chat-foot"><div class="suggestions"><button data-prompt="List active runs">Active runs</button><button data-prompt="Start a run">Start a run</button></div>
  <form id="chat-form"><textarea id="chat-input" aria-label="Message AFM Assistant" placeholder="Ask about your projects…" rows="2" required></textarea><button class="send" aria-label="Send message">↑</button></form><div class="model-tools"><button id="chat-model" title="Assistant settings"></button><button id="quick-model-key" title="Change assistant model and reasoning" aria-label="Change assistant model and reasoning"></button></div></div>
</aside></div>
<dialog id="picker" aria-label="Switch project"><input id="query" type="search" placeholder="Find a project or run…" aria-label="Find a project or run"><div id="results"></div><footer>↑ ↓ to navigate <span>↵ to open</span><span>esc to close</span></footer></dialog>
<dialog id="launch" aria-labelledby="launch-title">
  <div class="pane-head"><h2 id="launch-title">New run</h2><button class="icon" data-close aria-label="Close launcher">×</button></div>
  <label>Project<select id="launch-project"></select></label>
  <label class="sr-only" for="workflow-search">Find a flow or pipeline</label><input id="workflow-search" type="search" placeholder="Find a flow or pipeline…" autocomplete="off">
  <div id="workflows" class="choices"></div>
  <div class="git-row"><label for="launch-git">Workspace</label><select id="launch-git"></select></div><p class="hint" id="git-hint"></p><div class="actions"><kbd id="launch-hint"></kbd><button class="primary" id="launch-submit">Start run</button></div>
</dialog>
<dialog id="quick-model" aria-labelledby="quick-model-title"><form id="quick-model-form">
  <div class="pane-head"><h2 id="quick-model-title">Assistant model</h2><button type="button" class="icon" data-close aria-label="Close model picker">×</button></div>
  <label>Agent<select id="quick-agent"></select></label>
  <label>Model<input id="quick-model-id" placeholder="CLI default" autocomplete="off"></label>
  <label>Reasoning<select id="quick-effort"></select></label>
  <div class="actions"><kbd>↵ Apply</kbd><button class="primary">Apply</button></div>
</form></dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <div class="pane-head"><h2 id="settings-title">Settings</h2><button class="icon" data-close aria-label="Close settings">×</button></div>
  <div id="settings-body"></div>
</dialog>
<dialog id="open-project" aria-labelledby="folder-title">
  <div class="pane-head"><h2 id="folder-title">Open project</h2><button class="icon" data-close aria-label="Close project picker">×</button></div>
  <p class="muted">Choose a folder to open its workspace, even if it has no runs yet.</p>
  <button class="action" id="browse-project">Browse folders…</button>
  <form id="path-form"><label>Or enter a project path<input id="project-path" placeholder="~/work/my-project" required></label><label class="check"><input type="checkbox" id="path-git"> Git repository</label><div class="actions"><button class="primary">Open project</button></div></form>
</dialog>
<input type="file" id="folder" webkitdirectory multiple hidden>
<input type="file" id="source-folder" webkitdirectory multiple hidden>
<script src="store.js"></script><script src="desktop.js"></script><script src="library.js"></script><script src="controls.js"></script><script src="attention.js"></script>
<script src="inventory.js"></script><script src="native.js"></script><script src="select.js"></script>
</body></html>
