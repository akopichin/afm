docker:
  agents:
    desktop-dev-writer:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth: {from: "env:CLAUDE_CODE_OAUTH_TOKEN", to: "env:CLAUDE_CODE_OAUTH_TOKEN"}
    desktop-dev-review-runtime:
      type: codex
      model: gpt-6.1-sol
      reasoning: high
    desktop-dev-review-interface:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth: {from: "env:CLAUDE_CODE_OAUTH_TOKEN", to: "env:CLAUDE_CODE_OAUTH_TOKEN"}
    desktop-dev-review-integrations:
      type: codex
      model: gpt-6.1-sol
      reasoning: high
    desktop-dev-verify:
      type: codex
      model: gpt-6.1-sol
      reasoning: high
collaboration:
  profiles:
    desktop-dev-review-runtime:
      title: Desktop runtime and packaging review
      command: desktop-dev-review-runtime
      instructions: |
        Review DS-01,02,03,10 when affected by the implementation. Use the plan and acceptance evidence. Trace real run launch,
        process ownership, cleanup, sidecar pairing and packaged startup. Check failure
        recovery and platform limitations. Report concrete defects, reproduction
        and proposed regression checks. Leave the worktree untouched.
    desktop-dev-review-interface:
      title: Desktop interface and input review
      command: desktop-dev-review-interface
      instructions: |
        Review DS-04,05,06,09 when affected by the implementation, against the Graphite baseline. Trace shortcuts
        across shell, dashboard and Live, modal focus, resize and hidden view behavior.
        Check performance and keyboard evidence. Report actionable findings and test gaps.
        Leave the worktree untouched.
    desktop-dev-review-integrations:
      title: Desktop assistant and browser review
      command: desktop-dev-review-integrations
      instructions: |
        Review DS-07,08 when affected by the implementation. Trace provider settings and credentials, MCP permissions, stage
        browser ownership, reconnect, cancellation and cleanup. Check for fixture fallbacks
        and unsupported acceptance claims. Report reproducible issues and proposed checks.
        Leave the worktree untouched.
