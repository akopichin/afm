version: 2

project_name: afm

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/afm
    binary: afm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: afm
    directory: Formula
    homepage: "https://github.com/akopichin/afm"
    description: "AI flow manager — orchestrates multi-stage agent runs"
    repository:
      owner: akopichin
      name: homebrew-afm
      branch: main
      token: "{{ .Env.RELEASE_TOKEN }}"
    commit_author:
      name: afm-release-bot
      email: afm-release-bot@users.noreply.github.com
    install: |
      bin.install "afm"
    test: |
      system "#{bin}/afm", "--version"
