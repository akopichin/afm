version: 2

project_name: afm

release:
  github:
    owner: akopichin
    name: afm
  prerelease: auto
  make_latest: '{{ if or .Prerelease (lt .Major 3) }}false{{ else }}true{{ end }}'

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/afm
    binary: afm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - &afm_cask
    name: afm
    skip_upload: '{{ if or .Prerelease (lt .Major 3) }}true{{ else }}false{{ end }}'
    binaries:
      - 'afm{{ if lt .Major 3 }}-{{ .Major }}{{ end }}{{ if .Prerelease }}-{{ index (split .Prerelease ".") 0 }}{{ end }}'
    homepage: "https://github.com/akopichin/afm"
    description: "AI flow manager — orchestrates multi-stage agent runs"
    caveats: |
      Claude-скиллы (/afm-run, /afm-check и др.) не устанавливаются автоматически.
      Установить: afm{{ if lt .Major 3 }}-{{ .Major }}{{ end }}{{ if .Prerelease }}-{{ index (split .Prerelease ".") 0 }}{{ end }} install-skills
    directory: Casks
    repository:
      owner: akopichin
      name: homebrew-afm
      branch: main
      token: "{{ .Env.RELEASE_TOKEN }}"
    commit_author:
      name: afm-release-bot
      email: afm-release-bot@users.noreply.github.com
    hooks:
      pre:
        install: |
          {{ if lt .Major 3 -}}
          File.rename(staged_path.join("afm"), staged_path.join("afm-{{ .Major }}"))
          {{ else if .Prerelease -}}
          File.rename(staged_path.join("afm"), staged_path.join("afm-{{ index (split .Prerelease ".") 0 }}"))
          {{- end }}
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/afm{{ if lt .Major 3 }}-{{ .Major }}{{ end }}{{ if .Prerelease }}-{{ index (split .Prerelease ".") 0 }}{{ end }}"]
            system_command "/usr/bin/codesign", args: ["-f", "-s", "-", "#{staged_path}/afm{{ if lt .Major 3 }}-{{ .Major }}{{ end }}{{ if .Prerelease }}-{{ index (split .Prerelease ".") 0 }}{{ end }}"]
          end
  - <<: *afm_cask
    name: afm-alpha
    skip_upload: '{{ if and (ge .Major 3) (eq (index (split .Prerelease ".") 0) "alpha") }}false{{ else }}true{{ end }}'
  - <<: *afm_cask
    name: afm-beta
    skip_upload: '{{ if and (ge .Major 3) (eq (index (split .Prerelease ".") 0) "beta") }}false{{ else }}true{{ end }}'
  - <<: *afm_cask
    name: afm@1
    skip_upload: '{{ if and (eq .Major 1) (not .Prerelease) }}false{{ else }}true{{ end }}'
  - <<: *afm_cask
    name: afm@2
    skip_upload: '{{ if and (eq .Major 2) (not .Prerelease) }}false{{ else }}true{{ end }}'
