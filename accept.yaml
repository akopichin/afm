name: accept-02
description: "accept"

prompt: |
  if goga binary not installed - install it with `pip install goga && goga connect claude`
  constraint: пиши все на русском. Не используй английский кроме спец терминов нужных.

stages:
  - id: install-goga
    name: "Install goga"
    description: |
      Установить бинарь goga и подключить его к claude (skills/commands).
    script: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude

  - id: accept
    name: "accept"
    interactive: true
    agents: [auto]
    description: |
      засинкать codemanifest-ы с кодом.
    prompt: |
      сделать goga-accept чтобы манифесты flowmanager обновились т.к. много кода поменялось.
    skills:
      - goga-accept
    command: claude
    script_before: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude
    depends_on: [install-goga]

  - id: commit
    name: "commit"
    interactive: true
    agents: [auto]
    description: |
      привести в порядок и закоммитить все.
    prompt: |
      прогнать lint
      прогнать test
      починить их при ошибках
      обновить доку
      обновить release notes
      сделать коммит
    script_before: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude
    depends_on: [accept]
