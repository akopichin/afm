name: feature-02
description: "Feature implementation"

prompt: |
  Общие правила для всего flow:
  - **Общайся на русском**


stages:
  - id: install-goga
    name: "Install goga"
    description: |
      Установить бинарь goga и подключить его к claude (skills/commands).
    script: |
      if ! command -v goga >/dev/null 2>&1; then
        pip install goga 2>&1 || pip install --user goga 2>&1 || {
          mkdir -p ~/.local/bin ~/.local/venvs
          python3 -m venv ~/.local/venvs/goga
          ~/.local/venvs/goga/bin/pip install --quiet goga
          ln -sf ~/.local/venvs/goga/bin/goga ~/.local/bin/goga
          hash -r
        }
      fi
      goga connect claude

  - id: propose
    name: "Propose"
    interactive: true
    agents: [auto]
    description: |
      Выяснение что делать.
    prompt: |
      Save the task file as `<git branch --show-current>.md`
    skills:
      - goga-propose
    script_before: |
      if ! command -v goga >/dev/null 2>&1; then
