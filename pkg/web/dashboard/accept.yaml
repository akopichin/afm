name: web-accept-1
description: "init web dashboard on goga"

supervisor_command: claude

prompt: |
  if goga binary not installed - install it with `pip install goga && goga connect claude`
  constraint: пиши все на русском. Не используй английский кроме спец терминов нужных.

stages:
  - id: accept
    name: "accept"
    supervisor: true
    supervisor_prompt: сделай автономным этот стейдж
    interactive: true
    agents: [planning]
    description: |
      засинкать codemanifest-ы с кодом.
    prompt: |
      сделать goga-accept чтобы манифесты фронта обновились по коду.
    skills:
      - goga-accept
    command: claude

  - id: commit
    name: "commit"
    supervisor: true
    supervisor_prompt: сделай автономным этот стейдж
    interactive: true
    agents: [planning]
    description: |
      привести в порядок и закоммитить все.
    prompt: |
      прогнать lint
      прогнать test
      починить их при ошибках
      обновить доку
      обновить release notes
      сделать коммит
    depends_on: [accept]
