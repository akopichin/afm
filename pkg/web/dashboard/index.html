<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afm Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('afm-mode'); } catch (e) {}
        var mode = stored === 'dark' || stored === 'light'
          ? stored
          : 'dark';
        document.documentElement.dataset.theme = mode;
      })();
    </script>
    <link rel="stylesheet" href="./skins/graphite/index.css">
    <!-- Постоянный CSS бокового агента и общих чат-композеров подключается отдельно, поскольку skin_dir заменяет основной stylesheet. -->
    <link rel="stylesheet" href="./side-agent.css">
    <link rel="stylesheet" href="./chat-composer.css">
  <script type="module" crossorigin src="./assets/index-BygSq3Mi.js"></script>
</head>
<body class="theme-graphite">
    <div id="root"></div>
</body>
</html>
