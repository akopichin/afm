<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afm Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('afm-mode'); } catch (e) {}
        var mode = stored === 'dark' || stored === 'light'
          ? stored
          : 'dark';
        document.documentElement.dataset.theme = mode;
      })();
    </script>
    <link rel="stylesheet" href="/skins/graphite/index.css">
    <!-- Структурный CSS «бокового» агента — ПОСТОЯННАЯ ссылка, сервер её не
         подменяет (в отличие от skin-ссылки выше). Присутствует и для встроенных
         тем, и для skin_dir: skin_dir заменяет основной stylesheet целиком,
         поэтому доставлять этот слой через skin @import нельзя. Оформление — на
         семантических токенах активной темы. -->
    <link rel="stylesheet" href="/side-agent.css">
</head>
<body class="theme-graphite">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
